<!doctype html>
<html>
  <head>
    <title>Dialog</title>
  </head>
  <body>
    <button id="alert" onclick="alert('hello')">Alert</button>
    <button id="confirm" onclick="window._r = confirm('ok?')">Confirm</button>
    <button
      id="prompt"
      onclick="
        document.getElementById('promptResult').textContent = prompt('name?')
      "
    >
      Prompt
    </button>
    <div id="promptResult"></div>
  </body>
</html>
