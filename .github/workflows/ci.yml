name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: make install
        run: make install
      - name: make check
        run: make check
      - name: make docs-build
        if: matrix.python-version == '3.13'
        run: make docs-build

  browser:
    name: browser (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install locked dependencies
        run: make install
      - name: Install Firefox system libraries
        run: uv run playwright install-deps firefox
      - name: Cache the compatible browser binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('src/justpen_browser_mcp/browser_runtime.py') }}
      - name: Fetch the tested Camoufox browser
        run: make browser-fetch
      - name: Test all browser tools and installed transports
        run: make test-e2e
      - name: Verify locked and minimum consumer wheel installations
        run: make test-consumer
