name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Require the committed lockfile
        run: make lock-check
      - name: make install
        run: make install
      - name: Shared formatting and lint
        run: make check-static
      - name: Strict documentation build
        run: make docs-build

  check:
    name: check (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Require the committed lockfile
        run: make lock-check
      - name: make install
        run: make install
      - name: Active Python typing and unit tests
        run: make check-python

  browser:
    name: browser (py${{ matrix.python-version }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Require the committed lockfile
        run: make lock-check
      - name: Install locked dependencies
        run: make install
      - name: Install Firefox system libraries
        run: uv run playwright install-deps firefox
      - name: Cache the compatible browser binary
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src/justpen_browser_mcp/browser_runtime.py', 'src/justpen_browser_mcp/browser_mirror.py',
            'src/justpen_browser_mcp/browser_releases.py') }}
      - name: Fetch the tested Camoufox browser
        run: make browser-fetch
      - name: Test all browser tools and installed transports
        if: matrix.python-version != '3.13'
        run: make test-e2e
      - name: Real tool, browser, release and documentation scenarios
        if: matrix.python-version == '3.13'
        run: make test-integration
      - name: Verify locked and minimum consumer wheel installations
        run: make test-consumer

  deploy-docs:
    name: Publish documentation
    needs: [quality, check, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://justpen-browser-mcp.justpenkit.justmumu.com/
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    env:
      UV_PYTHON: '3.13'
    steps:
      - name: Check publishing credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Set CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install "$UV_PYTHON"
      - name: Install locked dependencies
        run: make install
      - name: Build documentation
        run: make docs-build
      - name: Require current main before publication
        run: |
          git fetch --no-tags --depth=1 origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo '::error::A newer main commit exists. Publish that commit instead.'
            exit 1
          fi
      - name: Publish to Cloudflare Pages
        id: pages
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=justpen-browser-mcp --branch=main --commit-hash=${{ github.sha }}
      - name: Verify production deployment
        env:
          PAGES_ENVIRONMENT: ${{ steps.pages.outputs.pages-environment }}
        run: |-
          if [ "$PAGES_ENVIRONMENT" != 'production' ]; then
            echo '::error::Pages did not report a production deployment. Set the Pages production branch to main before retrying.'
            exit 1
          fi
